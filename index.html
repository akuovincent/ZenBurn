<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenBurn 靜燃 — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+TC:wght@200;300&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#080604;
  --orange:#c46a1a;
  --gold:#c9a227;
  --gold-pale:#e8cc7a;
  --cream:#f5efe3;
}
html,body{height:100%}
body{
  background:var(--black);
  color:var(--cream);
  font-family:'Noto Sans TC',sans-serif;
  font-weight:300;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
}

/* Background ambient glow */
.bg-glow{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 30% 40%, rgba(196,106,26,0.07) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 75% 65%, rgba(201,162,39,0.05) 0%, transparent 70%);
  pointer-events:none;
}

/* Smoke wisps */
.smoke-svg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0.5;
}

/* Main container */
.container{
  position:relative;z-index:1;
  text-align:center;
  padding:3rem 2rem;
  max-width:680px;
  width:100%;
}

/* Logo */
.logo{
  width:min(360px,80vw);
  margin:0 auto 3.5rem;
  display:block;
  opacity:0.95;
}

/* Flame icon */
.flame-wrap{
  margin:0 auto 2rem;
  animation:float 5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* Gold divider */
.divider{
  width:120px;height:1px;
  background:linear-gradient(to right, transparent, rgba(201,162,39,0.6), transparent);
  margin:2rem auto;
}

/* Main headline */
.headline{
  font-family:'Noto Serif TC',serif;
  font-weight:200;
  font-size:clamp(1.6rem,4vw,2.6rem);
  letter-spacing:0.12em;
  color:var(--cream);
  margin-bottom:0.6rem;
  line-height:1.4;
}

/* English subtitle */
.subtitle{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(1.1rem,2.5vw,1.6rem);
  color:var(--gold);
  letter-spacing:0.15em;
  margin-bottom:2.2rem;
}

/* Description */
.desc{
  font-size:0.9rem;
  line-height:2.2;
  color:rgba(245,239,227,0.5);
  letter-spacing:0.05em;
  margin-bottom:2.5rem;
}

/* Tagline */
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:1.05rem;
  color:rgba(201,162,39,0.6);
  letter-spacing:0.1em;
  margin-bottom:2.8rem;
}

/* Contact button */
.contact-btn{
  display:inline-block;
  border:1px solid rgba(201,162,39,0.45);
  color:var(--gold);
  font-size:0.72rem;
  letter-spacing:0.3em;
  padding:0.85rem 2.5rem;
  text-decoration:none;
  font-family:'Noto Sans TC',sans-serif;
  transition:all 0.35s;
  text-transform:uppercase;
  background:transparent;
  cursor:pointer;
}
.contact-btn:hover{
  border-color:var(--gold);
  background:rgba(201,162,39,0.08);
}

/* Footer note */
.footer-note{
  margin-top:3rem;
  font-size:0.62rem;
  letter-spacing:0.2em;
  color:rgba(245,239,227,0.18);
}

@media(max-width:480px){
  .container{padding:2rem 1.5rem}
  .logo{width:75vw;margin-bottom:2.5rem}
}
</style>
</head>
